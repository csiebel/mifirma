# Railway construye con Nixpacks; esto agrega paquetes del sistema a la imagen.
#
# poppler trae `pdftotext`, que usa la comprobación de anotaciones sobre texto
# firmado (src/firma/tapado.ts). Sin él el producto anda igual, pero ese
# veredicto sale «no comprobable (pdftotext no está instalado)» — honesto, y
# menos de lo que se puede afirmar teniéndolo.
#
# qpdf lo usa normalizar() (src/firma/pades.ts) para renumerar una base
# agujereada que trae formulario del cliente, sin perderlo. Sin qpdf el
# producto anda igual: esa base sigue tal cual, con el cartel feo de
# Acrobat en documentos grandes — como hasta el 10/8.
#
# El "..." conserva los paquetes que Nixpacks pone por defecto para Node.
[phases.setup]
nixPkgs = ["...", "poppler_utils", "qpdf"]
