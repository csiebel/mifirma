<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Firmar · MiFirma</title>
<meta name="theme-color" content="#0B2B4A" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --brand:#0B2B4A; --brand-600:#14456f; --brand-50:#eef4fa;
    --acc:#0AA2B0; --acc-50:#e4f7f8; --acc-700:#077b86;
    --ink:#0f1e2c; --mut:#5a6878; --line:#e4ebf3; --soft:#f7fafc; --paper:#fff;
    --danger:#b42318; --ok:#067647; --r:11px;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--soft);line-height:1.55;
       -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

  header{background:var(--paper);border-bottom:1px solid var(--line);padding:12px 20px;
         display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:none}
  header img{height:26px}
  header .doc{min-width:0;flex:1}
  header .doc b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .doc span{font-size:12.5px;color:var(--mut)}

  main{flex:1;display:grid;grid-template-columns:1fr;min-height:0;overflow:hidden}
  @media(min-width:900px){main{grid-template-columns:1fr 380px}}


  /* ── El visor con pdf.js ──────────────────────────────────────────────────
     `.visor` deja de ser un iframe y pasa a ser una columna con barra arriba y
     hojas abajo. `min-height:0` en el contenedor no es adorno: sin él, un hijo
     con scroll dentro de un grid crece hasta reventar la caja en vez de
     scrollear. */
  .visor{background:#4b5563;min-height:52vh;display:flex;flex-direction:column;min-width:0}
  .vis-iframe{width:100%;height:100%;border:0;display:block;flex:1}
  .vis-barra{flex:none;background:rgba(15,30,44,.55);padding:8px 12px;display:flex;
             gap:8px;align-items:center;flex-wrap:wrap;min-height:44px}
  .vis-barra .btn{width:auto;margin:0;padding:7px 13px;font-size:13px}

  /* ⚠ Sobre fondo OSCURO se invierte la convención de toda la aplicación.
     En una tarjeta blanca, el botón lleno de azul es el activo. Acá el azul es
     casi el color de la barra: el activo se hundía y el inactivo, que es
     blanco, saltaba a la vista. La pantalla decía lo contrario de lo que
     pasaba, y la persona elegía la marca equivocada creyendo que elegía bien.
     Sobre oscuro el que manda es el CLARO. */
  .vis-seg{display:flex;gap:0;background:rgba(255,255,255,.14);border-radius:10px;padding:3px;flex:none}
  .vis-seg .btn{border:0;border-radius:7px;padding:7px 16px;font-size:13px;font-weight:600;
                margin:0;width:auto;transition:.12s}
  .vis-seg .btn-s{background:transparent;color:#cbd5e1;box-shadow:none}
  .vis-seg .btn-s:hover{background:rgba(255,255,255,.12);color:#fff}
  .vis-seg .btn-p{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .vis-seg .btn-p:hover{background:#fff}
  .vis-barra .pista{color:#cbd5e1;margin:0;font-size:12.5px}
  .vis-caja{flex:1;overflow:auto;min-height:0}
  .vis-hojas{padding:16px 0 28px}
  .vis-cargando{color:#e2e8f0;text-align:center;padding:48px 20px;font-size:14px}
  .vis-hoja{position:relative;margin:0 auto 16px;background:#fff;
            box-shadow:0 2px 10px rgba(0,0,0,.35);touch-action:manipulation}
  .vis-lienzo{display:block;width:100%;height:100%}
  .vis-num{position:absolute;left:-9px;top:-8px;background:#0f1e2c;color:#fff;font-size:11px;
           min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;
           padding:0 5px;z-index:2}

  /* La marca. La propia se ve nítida y se agarra; la ajena queda apagada y
     no responde al puntero — que no se pueda tocar lo dice la política, esto
     sólo evita el intento. */
  .vis-marca{position:absolute;display:grid;place-items:center;border-radius:5px;z-index:3}
  .vis-marca img{max-width:100%;max-height:100%;display:block;pointer-events:none}
  .vis-marca .vis-et{font-size:11px;font-weight:600;line-height:1.1;text-align:center;
                     padding:0 3px;user-select:none;pointer-events:none}
  .vis-marca.mia{border:1.5px solid var(--acc-700);background:rgba(10,162,176,.12);
                 color:var(--acc-700)}
  .vis-marca.ajena{border:1.5px dashed #9aa7b6;background:rgba(154,167,182,.14);
                   color:#64748b;pointer-events:none}
  /* El recuadro que aparece en el acto, mientras el servidor escribe la marca.
     Punteado y latiendo: se lee como «esto todavía se está haciendo», que es
     exactamente lo que está pasando. */
  .vis-marca.fantasma{border-style:dashed;opacity:.6;animation:latir 1s ease-in-out infinite;
                      pointer-events:none}
  @keyframes latir{0%,100%{opacity:.35}50%{opacity:.75}}
  @media (prefers-reduced-motion:reduce){.vis-marca.fantasma{animation:none;opacity:.6}}
  .vis-marca.arrastrable{cursor:move;touch-action:none}
  .vis-marca.moviendo{opacity:.75;box-shadow:0 3px 12px rgba(0,0,0,.28)}

  /* El tirador para cambiar el tamaño de la firma.
     ⚠ Grande y con borde blanco a propósito. El equivalente del editor del
     emisor medía 12 px del mismo color que el borde del recuadro y no se veía:
     se pidió como función nueva una que ya estaba. Un control que no se ve es
     un control que no existe. 16 px es además lo mínimo agarrable con el dedo. */
  .vis-tirador{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;
               border-radius:4px;background:var(--acc-700);border:2px solid #fff;
               box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:nwse-resize;
               touch-action:none;z-index:4}

  /* El zoom. Fijo abajo a la derecha, arriba de la barra de acciones: si
     scrolleara con la hoja desaparecería justo cuando se está mirando de cerca
     un renglón del final. */
  .vis-zoom{position:fixed;right:16px;bottom:86px;z-index:20;display:flex;gap:2px;
            background:rgba(15,30,44,.92);border:1px solid rgba(255,255,255,.16);
            border-radius:10px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.45)}
  .vis-zoom button{border:0;background:transparent;color:#e2e8f0;cursor:pointer;
                   font-size:15px;font-weight:600;line-height:1;padding:8px 11px;
                   border-radius:7px;min-width:34px;margin:0;width:auto}
  .vis-zoom button:hover{background:rgba(255,255,255,.14);color:#fff}
  .vis-zoom .vis-zoom-n{font-size:12px;min-width:54px;letter-spacing:.2px}
  @media (max-width:640px){.vis-zoom{bottom:98px;right:10px}}

  .vis-quitar{position:absolute;right:-9px;top:-9px;width:20px;height:20px;border-radius:50%;
              border:0;background:var(--danger);color:#fff;font-size:14px;line-height:1;
              cursor:pointer;display:grid;place-items:center;padding:0}
  .vis-barra .msg{margin:0;padding:6px 10px;font-size:12.5px}
  .vis-aviso-campos{color:#fde68a;font-size:12.5px;font-weight:600}

  /* ── Los campos, SOBRE la hoja ────────────────────────────────────────────
     El input ocupa el rectángulo que el PDF declara para ese campo, ni más ni
     menos: si se lo agranda para que entre cómodo, tapa el texto de al lado y
     la persona ya no lee lo que está completando.

     El fondo amarillo translúcido es lo que hace que se vean de un vistazo en
     una hoja llena de texto. Es la convención de todos los lectores de PDF con
     formulario, y acá importa más que en ninguno: es lo que separa «tocá acá
     para escribir» de «tocá acá para firmar», que están a un centímetro. */
  .vis-campo{position:absolute;z-index:4;border-radius:3px}
  .vis-campo.mio{background:rgba(253,224,71,.30);box-shadow:inset 0 0 0 1px #d9a406}
  .vis-campo.mio:focus-within{background:rgba(253,224,71,.16);
                              box-shadow:inset 0 0 0 2px var(--brand-600)}
  /* El de otro se ve con lo que escribió y no se toca. Misma regla que la
     marca ajena: mostrar el documento como va a quedar, sin ofrecer tocarlo. */
  .vis-campo.ajeno{background:rgba(148,163,184,.16);box-shadow:inset 0 0 0 1px #cbd5e1;
                   pointer-events:none}
  .vis-campo.falta{box-shadow:inset 0 0 0 1.5px var(--danger)}
  .vis-campo.mal{box-shadow:inset 0 0 0 2px var(--danger)}
  .vis-campo.guardado{box-shadow:inset 0 0 0 2px var(--ok)}
  .vis-campo.congelado{background:rgba(148,163,184,.16)}
  .vis-campo.senalado{animation:senalar 1.6s ease-out}
  @keyframes senalar{0%,40%{box-shadow:0 0 0 4px rgba(37,99,235,.55);
                            background:rgba(253,224,71,.55)}
                     100%{box-shadow:inset 0 0 0 1px #d9a406}}
  .vis-campo input[type=text],.vis-campo input[type=date],.vis-campo select,
  .vis-campo textarea{width:100%;height:100%;border:0;background:transparent;
                      font-family:inherit;color:#111827;padding:0 3px;margin:0;
                      line-height:1.15;box-sizing:border-box}
  .vis-campo textarea{resize:none;overflow:auto;padding:2px 3px}
  .vis-campo input:focus,.vis-campo select:focus,.vis-campo textarea:focus{outline:0}
  .vis-campo input[type=checkbox]{position:absolute;inset:0;margin:auto;width:80%;height:80%;
                                  max-width:18px;max-height:18px;accent-color:var(--brand)}
  .vis-campo-fijo{display:block;padding:0 3px;color:#334155;line-height:1.15;
                  overflow:hidden;white-space:pre-wrap}
  .vis-campo-obl{position:absolute;right:-7px;top:-7px;color:var(--danger);font-size:15px;
                 font-weight:700;line-height:1;pointer-events:none}

  /* El rótulo que dice QUÉ se pide, arriba del recuadro. Sin esto el firmante
     ve un renglón amarillo vacío arriba de otro renglón amarillo vacío, y la
     etiqueta vivía en un tooltip —que en un teléfono no existe—. Va afuera de
     la caja porque adentro competiría con lo que la persona escribe. */
  /* ⚠ Aparece cuando hace falta, no siempre.
     Un formulario que YA trae sus etiquetas impresas —«Razón social», «RUT»—
     no necesita que le pongamos las nuestras encima: taparle el texto al
     documento que la persona está por firmar es peor que no rotular nada.
     Así que el rótulo se muestra al pasar por encima o al enfocar, y queda
     fijo sólo donde no hay otra forma de saberlo: las casillas y las listas,
     que no tienen texto de ayuda adentro. Para los de escribir, ese papel lo
     cumple el placeholder, que no tapa nada. */
  .vis-campo-rot{position:absolute;left:0;bottom:100%;margin-bottom:2px;
                 font-size:10.5px;font-weight:700;line-height:1.25;white-space:nowrap;
                 color:#7a5c05;background:rgba(254,246,231,.97);border:1px solid #f5d9a0;
                 border-radius:5px;padding:1px 5px;pointer-events:none;z-index:6;
                 max-width:260px;overflow:hidden;text-overflow:ellipsis;
                 opacity:0;transition:opacity .12s}
  .vis-campo-rot.siempre{opacity:1}
  .vis-campo:hover .vis-campo-rot,
  .vis-campo:focus-within .vis-campo-rot,
  .vis-campo.senalado .vis-campo-rot,
  .vis-campo.falta .vis-campo-rot{opacity:1}
  .vis-campo-rot.ajeno{color:#64748b;background:rgba(248,250,252,.97);border-color:#e2e8f0}
  .vis-campo input::placeholder,.vis-campo textarea::placeholder{color:#a3806a;opacity:.75}

  aside{background:var(--paper);border-left:1px solid var(--line);padding:26px 24px;overflow:auto}
  h1{font-size:21px;margin:0 0 6px;letter-spacing:-.02em}
  .lead{color:var(--mut);font-size:14px;margin:0 0 20px}

  label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
  input[type=text]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);
                   border-radius:var(--r);background:var(--paper);color:var(--ink)}
  input[type=text]:focus{outline:2px solid var(--brand-600);outline-offset:-1px}
  .firmita{font-family:'Segoe Script','Bradley Hand',cursive;font-size:24px}
  textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);
           border-radius:var(--r);min-height:90px;resize:vertical}

  .consent{display:flex;gap:11px;align-items:flex-start;background:var(--brand-50);
           border:1px solid #d6e4f2;border-radius:var(--r);padding:14px;margin-top:20px;cursor:pointer}
  .consent input{width:18px;height:18px;flex:none;margin-top:1px;accent-color:var(--brand)}
  .consent span{font-size:13.5px}

  .btn{width:100%;font:inherit;font-weight:600;font-size:15px;padding:13px;border-radius:var(--r);
       border:1px solid transparent;cursor:pointer;transition:.15s;margin-top:14px}
  .btn-p{background:var(--brand);color:#fff}
  .btn-p:hover{background:var(--brand-600)}
  .btn-p:disabled{opacity:.45;cursor:default}
  .btn-s{background:var(--paper);color:var(--mut);border-color:var(--line);font-size:13.5px;padding:9px}
  .btn-s:hover{color:var(--danger);border-color:#fecdc9}

  /* ── «Está trabajando» ────────────────────────────────────────────────────
     Una barra finita arriba de todo, que recorre la pantalla. Firmar tarda
     ocho segundos y quien firma no nos conoce: sin esto, la pantalla quieta se
     lee como rota y se aprieta el botón de nuevo.
     `pointer-events:none` porque no es un elemento con el que se interactúe;
     ocupa el borde superior y nada más. */
  .trabajando{position:fixed;inset:0 0 auto 0;height:3px;z-index:9999;pointer-events:none;
              opacity:0;transition:opacity .15s}
  .trabajando.visible{opacity:1}
  .trabajando::after{content:'';display:block;height:100%;width:38%;border-radius:0 3px 3px 0;
                     background:linear-gradient(90deg,transparent,var(--brand-600),transparent);
                     animation:recorrer 1.1s ease-in-out infinite}
  @keyframes recorrer{0%{transform:translateX(-100%)}100%{transform:translateX(365%)}}
  @media (prefers-reduced-motion:reduce){
    .trabajando::after{animation:none;width:100%;background:var(--brand-600);opacity:.6}
  }
  .btn.ocupado{opacity:.75;cursor:progress}

  .msg{margin-top:16px;font-size:13.5px;padding:11px 13px;border-radius:var(--r)}
  .msg.err{background:#fef3f2;color:var(--danger);border:1px solid #fecdc9}
  .msg.ok{background:#ecfdf3;color:var(--ok);border:1px solid #abefc6}
  .msg.aviso{background:#fef6e7;color:#8a5c05;border:1px solid #f5d9a0}
  .pista{font-size:12px;color:var(--mut);margin-top:8px}
  .hidden{display:none!important}

  .listo{display:grid;place-items:center;text-align:center;padding:60px 24px}
  /* La oferta de quedarse con el documento. Va DEBAJO del tick y con el texto a
     la izquierda: es un formulario, no un cartel, y centrarlo lo haría ilegible. */
  .oferta{margin:34px auto 0;max-width:420px;text-align:left;padding:22px;
          border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
  .oferta h2{font-size:17px;margin:0 0 6px}
  .oferta label{display:block;margin:14px 0 6px;font-size:13.5px;font-weight:600}
  .oferta select,.oferta input{width:100%;font:inherit;padding:11px 12px;
          border:1.5px solid var(--line);border-radius:var(--r);background:#fff}
  .oferta .btn{margin-top:18px;width:100%}
  .listo .tick{width:64px;height:64px;border-radius:50%;background:#ecfdf3;display:grid;place-items:center;
               margin-bottom:18px}
  .listo .tick svg{width:30px;height:30px;stroke:var(--ok);fill:none;stroke-width:2.5;
                   stroke-linecap:round;stroke-linejoin:round}

  /* ── La firma autógrafa del firmante ──────────────────────────────────────
     El pad se dibuja con el dedo: `touch-action:none` no es opcional, sin él
     el navegador scrollea la página en vez de dejar dibujar. El cuadriculado
     de fondo es para que se vea que es una zona donde se escribe y no una
     imagen vacía. */
  .rub-bloque{margin-top:18px}
  .rub-bloque:first-child{margin-top:0}
  .rub-desplegar{width:100%;font:inherit;font-size:13.5px;font-weight:600;color:var(--brand-600);
                 background:var(--brand-50);border:1px dashed #c7dcef;border-radius:var(--r);
                 padding:11px;cursor:pointer;text-align:left}
  .rub-desplegar:hover{background:#e4eefa}
  #cajaCaracter.pendiente{border:1.5px solid #f5d9a0;background:#fffdf7;border-radius:var(--r);
                          padding:14px 14px 4px;margin-bottom:6px}
  .campo-dato{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);
              border-radius:var(--r);background:var(--paper)}
  .campo-dato:focus{outline:2px solid var(--brand-600);outline-offset:-1px}
  #fCaracter{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);
             border-radius:var(--r);background:var(--paper);margin-bottom:2px}
  .rub-tabs{display:flex;gap:8px;margin:10px 0 12px}
  .rub-tab{width:auto;flex:1;margin-top:0;padding:9px;font-size:13.5px}
  .rub-pad{width:100%;height:170px;display:block;border:1.5px dashed var(--line);
           border-radius:var(--r);background:
             linear-gradient(90deg,transparent 96%,#eef2f7 96%) 0 0/22px 22px,
             linear-gradient(180deg,transparent 96%,#eef2f7 96%) 0 0/22px 22px, #fff;
           touch-action:none;cursor:crosshair}
  .rub-acc{display:flex;gap:8px;margin-top:10px}
  .rub-acc .btn{margin-top:0;width:auto;flex:1;padding:10px;font-size:13.5px}
  .rub-hecha{border:1px solid var(--line);border-radius:var(--r);background:
             repeating-conic-gradient(#f1f5f9 0 25%,#fff 0 50%) 0 0/16px 16px;
             padding:10px;display:grid;place-items:center;min-height:96px;margin-top:6px}
  .rub-hecha img,.rub-previa{max-width:100%;max-height:120px;display:block}
  #rubArchivo{width:100%;font:inherit;font-size:13.5px;padding:11px;border:1px solid var(--line);
              border-radius:var(--r);background:var(--paper)}
  .rub-aviso{background:#fef6e7;color:#8a5c05;border:1px solid #f5d9a0;
             border-radius:var(--r);padding:11px 13px;font-size:13px;margin-top:14px}
  footer{flex:none;text-align:center;padding:14px;font-size:12px;color:var(--mut);
         background:var(--paper);border-top:1px solid var(--line)}
</style>
</head>
<body>

<header>
  <img src="/logo.svg" alt="MiFirma" />
  <div class="doc">
    <b id="hTitulo">…</b>
    <span id="hEmisor"></span>
  </div>
</header>

<main id="pantalla">
  <div class="visor">
    <div class="vis-barra" id="visBarra"></div>
    <div class="vis-caja" id="visCaja"></div>
  </div>

  <aside>
    <div id="panel">
      <h1 id="pTitulo">Revisá y firmá</h1>
      <p class="lead" id="pLead">Leé el documento antes de firmar. Todo lo que hagas acá queda registrado.</p>
      <div id="msg"></div>
    </div>
  </aside>
</main>

<footer>MiFirma · Firma electrónica con validez legal</footer>

<script src="/visor.js"></script>
<script src="/rubrica.js"></script>
<script src="/firmar.js"></script>
</body>
</html>
